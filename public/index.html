<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#e7e1d5">
  <meta name="description" content="HIPKOP：Hip-Hop × K-pop 的数字地下唱片展厅。探索新作、榜单与同频社区。">
  <meta name="application-name" content="HIPKOP">
  <title>HIPKOP · Culture Feed</title>
  <link rel="icon" href="/hipkop-logo.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/outfit-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css?v=20261008-r5">
  <link rel="stylesheet" href="/exhibition.css?v=20261009-r7">
  <link rel="stylesheet" href="/culture.css?v=20261009-r7">
</head>
<body>
  <a class="skip-link" href="#view">跳到主内容</a>
  <div class="app">
    <header class="top">
      <div class="brand" role="button" tabindex="0" aria-label="HIPKOP 首页" onclick="navigate('home')" onkeydown="activateKey(event)"><img class="brand-logo" src="/hipkop-logo.svg" alt="" width="36" height="36"><span>HIPKOP</span></div>
      <div class="top-actions">
        <button class="discover-link" type="button" onclick="navigate('discover')" aria-label="搜索音乐">搜索 <span aria-hidden="true">↗</span></button>
        <button class="login" type="button" onclick="navigate('profile')" aria-label="打开我的收藏">唱片架</button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="主导航">
      <button type="button" data-tab="home" onclick="navigate('home')"><img class="nav-icon" src="/assets/icons/nav/home.svg" alt="" aria-hidden="true">首页</button>
      <button type="button" data-tab="charts" onclick="navigate('charts')"><img class="nav-icon" src="/assets/icons/nav/charts.svg" alt="" aria-hidden="true">榜单</button>
      <button type="button" data-tab="discover" onclick="navigate('discover')"><img class="nav-icon" src="/assets/icons/nav/compass.svg" alt="" aria-hidden="true">发现</button>
      <button type="button" data-tab="community" onclick="navigate('community')"><img class="nav-icon" src="/assets/icons/nav/features.svg" alt="" aria-hidden="true">社区</button>
      <button type="button" data-tab="profile" onclick="navigate('profile')"><img class="nav-icon" src="/assets/icons/nav/user.svg" alt="" aria-hidden="true">我的</button>
    </nav>
    <div id="miniPlayer" aria-label="试听播放器"></div>
    <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-label="详情面板" aria-hidden="true" onclick="closeSheet()"><div class="sheet-card" id="sheetCard" onclick="event.stopPropagation()"></div></div>
    <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <noscript><p class="discover-hint" style="padding:16px">HIPKOP 需要 JavaScript 才能加载目录与社区内容。</p></noscript>
  </div>
  <script src="/vendor/gsap.min.js"></script>
  <script src="/vendor/ScrollTrigger.min.js"></script>
  <script src="/culture.js?v=20261009-r7"></script>
  <script src="/exhibition-art.js?v=20261009-r7"></script>
  <script src="/exhibition.js?v=20261009-r7"></script>
  <script src="/player.js?v=20261009-r7"></script>
  <script src="/motion.js?v=20261009-r7"></script>
  <script src="/app.js?v=20261009-r7"></script>
</body>
</html>
