<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0b10">
  <meta name="description" content="HIPKOP PLAYER：全球 Hip-Hop、Rap 与 K-POP 的新作、榜单、评分与社区。">
  <title>HIPKOP PLAYER · CULTURE FEED</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand" onclick="navigate('home')"><span class="mark">H</span><span>HIPKOP</span></div>
      <div class="top-actions">
        <button class="discover-link" onclick="navigate('discover')">发现</button>
        <button class="login" onclick="toast('本地演示模式：登录功能已禁用')">登录</button>
      </div>
    </header>
    <main id="view"></main>
    <nav class="tabbar">
      <button data-tab="home" onclick="navigate('home')"><img class="nav-icon" src="/assets/icons/nav/home.svg" alt="">首页</button>
      <button data-tab="charts" onclick="navigate('charts')"><img class="nav-icon" src="/assets/icons/nav/charts.svg" alt="">榜单</button>
      <button data-tab="discover" onclick="navigate('discover')"><img class="nav-icon" src="/assets/icons/nav/compass.svg" alt="">发现</button>
      <button data-tab="community" onclick="navigate('community')"><img class="nav-icon" src="/assets/icons/nav/features.svg" alt="">社区</button>
      <button data-tab="profile" onclick="navigate('profile')"><img class="nav-icon" src="/assets/icons/nav/user.svg" alt="">我的</button>
    </nav>
    <div id="toast"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
