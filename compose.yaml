services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 8080
      HIPKOP_ADMIN_TOKEN: ${HIPKOP_ADMIN_TOKEN:?Set a private token of at least 32 characters}
      HIPKOP_PUBLIC_ORIGIN: https://${HIPKOP_DOMAIN:?Set your domain}
      HIPKOP_TRUST_PROXY: "true"
      HIPKOP_SCHEDULER: "true"
    volumes:
      - hipkop-data:/data
    expose:
      - "8080"
    mem_limit: 768m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HIPKOP_DOMAIN: ${HIPKOP_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  hipkop-data:
  caddy-data:
  caddy-config:
